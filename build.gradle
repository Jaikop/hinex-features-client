plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

tasks.register('build') {
	group = 'build'
	description = 'Собирает все модули, включая Forge'
	dependsOn subprojects.collect { "${it.path}:build" }
	dependsOn gradle.includedBuild('forge').task(':build')
}
