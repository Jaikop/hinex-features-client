modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/Jaikop/hinex-features-client"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://hinex-server.ru/"
logoFile = "assets/hinexfeatures/icon.png"
authors = "${mod_author}"
description = '''Клиентская часть для нормальной игры на Hinex. Исходный код: github.com/Jaikop/hinex-features-client'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
