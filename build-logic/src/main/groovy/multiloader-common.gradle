plugins {
	id 'java-library'
}

base {
	archivesName = "${mod_name}-${project.name}"
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = java_version as int
	it.options.encoding = 'UTF-8'
}

processResources {
	var expandProps = [
			'version'                      : version,
			'mod_id'                       : mod_id,
			'mod_name'                     : mod_name,
			'mod_author'                   : mod_author,
			'minecraft_version_range'      : minecraft_version_range,
			'loader_version'               : loader_version,
			'neoforge_version'             : neoforge_version,
			'neoforge_loader_version_range': neoforge_loader_version_range,
			'java_version'                 : java_version
	]
	inputs.properties(expandProps)

	filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml']) {
		expand expandProps
	}
}
